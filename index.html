<style id="app-style">
:root {
  --bg: #F2F5F3;
  --card: #FFFFFF;
  --text: #0F241B;
  --muted: #5D6D65;
  --line: #E0E7E3;
  --hero: #0F3D2E;
  --hero-text: #FFFFFF;
  --hero-muted: rgba(255, 255, 255, 0.74);
  --hero-track: rgba(255, 255, 255, 0.16);
  --accent: #F5C542;
  --accent-ink: #2B2200;
  --accent-soft: #FFF3C9;
  --done: #15803D;
  --done-ink: #FFFFFF;
  --tile: #F3F6F4;
  --tile-line: #E3EAE6;
  --bad: #B42318;
  --bad-soft: #FDECEA;
  --shadow: 0 1px 2px rgba(15, 36, 27, 0.05), 0 8px 24px rgba(15, 36, 27, 0.07);
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09110D;
    --card: #111B16;
    --text: #E8F2EC;
    --muted: #9AAEA4;
    --line: #1F2D26;
    --hero: #123D2D;
    --hero-text: #FFFFFF;
    --hero-muted: rgba(255, 255, 255, 0.72);
    --hero-track: rgba(255, 255, 255, 0.14);
    --accent: #F5C542;
    --accent-ink: #2B2200;
    --accent-soft: #3A3214;
    --done: #2BB673;
    --done-ink: #04150C;
    --tile: #17231D;
    --tile-line: #22322A;
    --bad: #FDA29B;
    --bad-soft: #3A1715;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09110D;
  --card: #111B16;
  --text: #E8F2EC;
  --muted: #9AAEA4;
  --line: #1F2D26;
  --hero: #123D2D;
  --hero-text: #FFFFFF;
  --hero-muted: rgba(255, 255, 255, 0.72);
  --hero-track: rgba(255, 255, 255, 0.14);
  --accent: #F5C542;
  --accent-ink: #2B2200;
  --accent-soft: #3A3214;
  --done: #2BB673;
  --done-ink: #04150C;
  --tile: #17231D;
  --tile-line: #22322A;
  --bad: #FDA29B;
  --bad-soft: #3A1715;
  --shadow: none;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html {
  scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
svg { flex: none; }
:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }

.page { max-width: 560px; margin: 0 auto; padding: 20px 16px 96px; }

.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; }
.save {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 11px 5px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}
.save .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
.save.wait .dot { background: var(--accent); }
.save.muted .dot { background: var(--muted); }
.save.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.save.bad .dot { background: var(--bad); }

.why { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 0; color: var(--muted); font-size: 15px; }
.why > span { white-space: nowrap; }
.why input {
  flex: 1;
  min-width: 0;
  padding: 2px 0 4px;
  border: 0;
  border-bottom: 1.5px dashed var(--line);
  border-radius: 0;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  font-weight: 700;
}
.why input::placeholder { color: var(--muted); font-weight: 500; opacity: 1; }
.why input:focus { outline: none; border-bottom: 1.5px solid var(--done); }
.why input:disabled { opacity: .75; }

.banner {
  margin: 14px 0 0;
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--bad-soft);
  color: var(--bad);
  font-size: 14.5px;
  font-weight: 650;
}

.hero {
  margin: 18px 0 0;
  padding: 20px 20px 18px;
  border-radius: 24px;
  background: var(--hero);
  color: var(--hero-text);
  box-shadow: var(--shadow);
}
.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--hero-muted);
  font-size: 13.5px;
  font-weight: 700;
}
.lock { display: inline-flex; align-items: center; gap: 7px; }
.pct { color: var(--accent); font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hero-total {
  margin: 14px 0 0;
  font-size: clamp(40px, 12vw, 54px);
  line-height: 1;
  font-weight: 800;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.hero-sub { margin: 7px 0 0; color: var(--hero-muted); font-size: 15px; font-weight: 600; }
.track { height: 10px; margin: 18px 0 0; border-radius: 999px; background: var(--hero-track); overflow: hidden; }
.track span {
  display: block;
  width: 0;
  height: 100%;
  border-radius: 999px;
  background: var(--accent);
  transition: width .6s cubic-bezier(.2, .8, .2, 1);
}
.hero-foot {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 10px 0 0;
  color: var(--hero-muted);
  font-size: 13.5px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 12px 0 0; }
.stat { min-width: 0; padding: 12px 12px 11px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
.stat-label, .stat-value { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.stat-label { color: var(--muted); font-size: 12.5px; font-weight: 700; }
.stat-value { margin: 4px 0 0; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.stat-sub { display: block; margin: 2px 0 0; color: var(--muted); font-size: 12px; line-height: 1.35; }

.draw {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 54px;
  margin: 14px 0 0;
  padding: 12px 18px;
  border: 0;
  border-radius: 16px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 16.5px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.draw:active { transform: scale(.99); }
.draw-result { margin: 10px 4px 0; color: var(--muted); font-size: 15px; }
.draw-result:empty { display: none; }
.draw-result b { color: var(--text); font-weight: 800; }

.board { margin: 18px 0 0; padding: 16px 14px 14px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); }
.board-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
.tabs { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.tabs button {
  min-height: 32px;
  padding: 4px 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
}
.tabs button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.board-hint { margin: 8px 0 12px; color: var(--muted); font-size: 13.5px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 5px; }
.tile {
  position: relative;
  aspect-ratio: 1 / 1;
  min-width: 0;
  padding: 0;
  border: 1px solid var(--tile-line);
  border-radius: 11px;
  background: var(--tile);
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  cursor: pointer;
  touch-action: manipulation;
  transition: background-color .15s ease, border-color .15s ease;
}
.tile.on { border-color: var(--done); background: var(--done); color: var(--done-ink); }
.tile.on::after {
  content: "";
  position: absolute;
  top: 3px;
  right: 5px;
  width: 3px;
  height: 7px;
  border: solid currentColor;
  border-width: 0 1.75px 1.75px 0;
  transform: rotate(45deg);
  opacity: .85;
}
.tile.pick { z-index: 1; border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent); }
.tile.pop { animation: pop .3s cubic-bezier(.2, .9, .3, 1.3); }
.tile.ping { animation: ping .8s ease-out 2; }
@keyframes pop { from { transform: scale(.8); } to { transform: none; } }
@keyframes ping {
  0%, 100% { box-shadow: 0 0 0 2px var(--accent); }
  50% { box-shadow: 0 0 0 6px var(--accent); }
}
.grid[data-filter="todo"] .tile.on, .grid[data-filter="done"] .tile:not(.on) { display: none; }
.grid[aria-busy="true"] .tile { cursor: progress; }
.ro .tile { cursor: default; }
.empty { margin: 6px 2px 4px; color: var(--muted); font-size: 14.5px; }

.panel { margin: 12px 0 0; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
.panel summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 16px;
  font-weight: 750;
  cursor: pointer;
  list-style: none;
}
.panel summary::-webkit-details-marker { display: none; }
.panel summary::after {
  content: "";
  width: 8px;
  height: 8px;
  margin: -4px 4px 0 12px;
  border: solid var(--muted);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
  transition: transform .2s ease;
}
.panel[open] summary::after { margin-top: 4px; transform: rotate(-135deg); }
.panel-body { padding: 0 16px 16px; }
.panel-body p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 16px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  font-weight: 750;
  cursor: pointer;
}
.btn-ghost[aria-pressed="true"] { border-color: var(--text); background: var(--text); color: var(--bg); }
.sep { height: 1px; margin: 16px 0; border: 0; background: var(--line); }
#restore-confirm { margin: 14px 0 0; }
.panel-body .confirm-text { color: var(--text); font-weight: 650; }

.mini {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--hero);
  color: var(--hero-text);
  box-shadow: 0 4px 16px rgba(0, 0, 0, .16);
  transform: translateY(-110%);
  transition: transform .25s ease;
}
.mini.show { transform: none; }
.mini-inner {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  max-width: 560px;
  margin: 0 auto;
  padding: 10px 16px 8px;
  font-size: 14.5px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.mini-of { color: var(--hero-muted); font-weight: 600; }
.mini-pct { color: var(--accent); }
.mini-track { height: 4px; background: var(--hero-track); }
.mini-track span { display: block; width: 0; height: 100%; background: var(--accent); }

.toast-wrap {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: flex;
  justify-content: center;
  padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
.toast {
  max-width: 520px;
  padding: 12px 16px;
  border-radius: 14px;
  background: var(--text);
  color: var(--bg);
  font-size: 15px;
  font-weight: 650;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: none; }
.toast:empty { display: none; }

@media (min-width: 520px) {
  .page { padding: 28px 24px 104px; }
  h1 { font-size: 30px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
  .tile { font-size: 15px; }
  .stat-value { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  .tile.pop, .tile.ping { animation: none; }
  .track span, .mini, .toast, .tile { transition: none; }
}
.notice {
  margin: 14px 0 0;
  padding: 14px 16px;
  border-radius: 16px;
  background: var(--accent-soft);
  color: var(--text);
  font-size: 15px;
}
.notice p { margin: 0 0 10px; font-weight: 650; }
.login { margin: 18px 0 0; padding: 20px 18px 16px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); box-shadow: var(--shadow); }
.login h2 { margin: 0 0 6px; font-size: 20px; }
.login-lead { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
.field { display: block; margin: 0 0 14px; color: var(--muted); font-size: 14px; font-weight: 700; }
.field input {
  display: block;
  width: 100%;
  margin: 6px 0 0;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--tile);
  color: var(--text);
  font-size: 16px;
  font-weight: 600;
}
.field input:focus { outline: none; border-color: var(--done); }
.btn-solid {
  width: 100%;
  min-height: 50px;
  padding: 12px 18px;
  border: 0;
  border-radius: 14px;
  background: var(--done);
  color: var(--done-ink);
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}
.btn-solid:disabled { opacity: .6; cursor: progress; }
.link {
  display: inline-block;
  margin: 8px 0 0;
  padding: 8px 0;
  border: 0;
  background: none;
  color: var(--text);
  font-size: 15px;
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.form-msg { margin: 0 0 14px; color: var(--text); font-size: 14.5px; font-weight: 650; }
.form-msg.error { color: var(--bad); }
.signed-out .hero, .signed-out .stats, .signed-out .draw, .signed-out .draw-result,
.signed-out .board, .signed-out #settings, .signed-out .mini { display: none !important; }
.waiting .tile { cursor: progress; }
.signed-out .why { display: none !important; }
.top-left { min-width: 0; }
.back {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin: 0 0 4px -8px;
  padding: 6px 10px 6px 4px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
}
.back:hover { color: var(--text); }
h1 { overflow-wrap: anywhere; }
.projects { display: grid; gap: 12px; margin: 18px 0 0; }
.pcard {
  display: block;
  width: 100%;
  padding: 16px 16px 14px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
  color: var(--text);
  text-align: left;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.pcard:active { transform: scale(.995); }
.pcard-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.pcard-name { overflow: hidden; font-size: 17px; font-weight: 800; white-space: nowrap; text-overflow: ellipsis; }
.pcard-pct { color: var(--done); font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pcard-total { display: block; margin: 6px 0 0; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.pcard-total b { color: var(--text); font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.pcard-track { display: block; height: 8px; margin: 12px 0 0; overflow: hidden; border-radius: 999px; background: var(--tile); }
.pcard-track span { display: block; width: 0; height: 100%; border-radius: 999px; background: var(--done); }
.pcard-foot { display: flex; justify-content: space-between; gap: 12px; margin: 10px 0 0; color: var(--muted); font-size: 13.5px; font-weight: 650; }
.empty-home { margin: 18px 2px 0; color: var(--muted); font-size: 15.5px; }
.form-card { margin: 18px 0 0; padding: 20px 18px 16px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); box-shadow: var(--shadow); }
.field-label { margin: 20px 0 8px; color: var(--muted); font-size: 14px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px;
  padding: 7px 14px;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  font-weight: 650;
  cursor: pointer;
}
.chip[aria-pressed="true"] { border-color: var(--text); background: var(--text); color: var(--bg); }
.chips + .field { margin-top: 12px; }
.preview { margin: 20px 0 16px; padding: 14px 16px; border-radius: 16px; background: var(--accent-soft); color: var(--text); font-size: 15px; }
.preview p { margin: 0; }
.preview p + p { margin-top: 8px; }
.preview b { font-weight: 800; }
.btn-danger { border-color: var(--bad) !important; color: var(--bad) !important; }
.signed-out #view-home, .signed-out #view-new, .signed-out #view-project { display: none !important; }
.mini { visibility: hidden; transition: transform .25s ease, visibility .25s; }
.mini.show { visibility: visible; }
.mini .mini-inner { align-items: center; }
.mini-back {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  margin: -6px 2px -6px -10px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--hero-text);
  cursor: pointer;
}
.mini-text { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.title-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-logo { display: inline-flex; flex: none; }
.brand-logo svg { display: block; width: 32px; height: 32px; border-radius: 9px; }
.top-right { display: flex; flex: none; align-items: center; gap: 8px; }
.icon-btn {
  display: inline-flex;

  display: inline-flex;

  margin-left: auto;
  padding: 7px 12px;
  border: 1px solid rgba(255, 255, 255, 0.28);

.pdot.wait { background: var(--accent); }
.pdot.bad { background: #FDA29B; }
.group-title { margin: 20px 4px 8px; color: var(--muted); font-size: 14px; font-weight: 700; }

/* ---------- 3.1: nome Goals como indicador de conexão ---------- */
.sr-only {
  position: absolute !important;
  width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.wordmark {
  font-family: "Unbounded", "Manrope", system-ui, sans-serif;

  letter-spacing: -0.035em;
  line-height: 1;
  transition: color 0.5s ease;
}
.brand {
  display: inline-flex; align-items: center; gap: 10px;

  border: 0; border-radius: 12px; background: none; color: inherit; cursor: pointer;
}

}

[data-sync="bad"] .top .wordmark { color: var(--bad); }
[data-sync="muted"] .top .wordmark { color: var(--muted); }
[data-sync="local"] .top .wordmark { color: var(--text); }
.brand:focus-visible, .wordmark-sm:focus-visible { outline: 2px solid var(--done); outline-offset: 2px; }

}

.lg-g { transform-box: fill-box; transform-origin: center; animation: lg-stamp 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.35) both; }
.lg-g1 { animation-delay: 0.25s; }
.lg-g2 { animation-delay: 0.5s; }
.lg-g3 { animation-delay: 0.75s; }
@keyframes lg-stamp { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .lg-g { animation: none; } .wordmark { transition: none; } }

  function saveLocal() {

  function startLocal() {
    storageOK = testStorage();
    if (storageOK) {
      var saved = loadKey(LOCAL_KEY);
      if (saved) {
        var s = normalizeState(saved);
        if (s.updatedAt >= embedded.updatedAt) data = s;
        else saveLocal();
      } else {
        var legacy = loadKey(LEGACY_KEY);
        if (legacy) {
          var conv = normalizeState(legacy);
          Object.keys(conv.projects).forEach(function (id) { if (!data.projects[id]) data.projects[id] = conv.projects[id]; });
        }
        if (Object.keys(data.projects).length) saveLocal();
      }
    }
    showBanner(storageOK ? '' : 'Este navegador não está guardando as marcações. Abra o arquivo no Chrome, no Edge ou no Safari, e não na pré-visualização de arquivos do celular.');

  function statusFromMeta(meta) {

  function authMessage(code) {

    if (/weak-password/.test(code)) return 'Senha fraca. Use pelo menos 6 caracteres.';
    if (/admin-restricted-operation/.test(code)) return 'A criação de contas está desligada no Firebase.';
    if (/invalid-email/.test(code)) return 'Esse e-mail não parece válido. Confira se foi digitado certo.';
    if (/missing-password/.test(code)) return 'Digite a senha.';
    if (/too-many-requests/.test(code)) return 'Muitas tentativas seguidas. Espere alguns minutos ou use “Esqueci minha senha”.';
    if (/network-request-failed/.test(code)) return 'Sem internet. Conecte-se para entrar.';
    if (/user-disabled/.test(code)) return 'Esta conta foi desativada no Firebase.';
    if (/operation-not-allowed/.test(code)) return 'O login com e-mail e senha ainda não foi ativado no Firebase.';
    if (/api-key|invalid-api-key|app-not-authorized/.test(code)) return 'A configuração do Firebase neste arquivo está incorreta.';

    els.restoreConfirm.hidden = true;
    els.nameForm.hidden = true;
    sheetTimer = setTimeout(function () { els.sheet.hidden = true; els.sheetBg.hidden = true; }, reduceMotion() ? 0 : 320);
    try { els.settingsBtn.focus({ preventScroll: true }); } catch (e) { /* sem foco */ }
  }
  els.settingsBtn.addEventListener('click', openSheet);
  els.sheetClose.addEventListener('click', closeSheet);
  els.sheetBg.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheetOpen) closeSheet(); });

  window.addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') render(); });
  setInterval(function () { if (document.visibilityState === 'visible') render(); }, 5 * 60 * 1000);
  window.addEventListener('online', function () {
    if (mode !== 'cloud') return;
    if (!fb) { loadSdk(); return; }
    refreshStatus();
  });
  window.addEventListener('offline', refreshStatus);

  if ('IntersectionObserver' in window) {
    try {
      new IntersectionObserver(function (entries) {
        var en = entries[0];
        els.mini.classList.toggle('show', view === 'project' && !en.isIntersecting && en.boundingClientRect.top < 0);
      }, { threshold: 0 }).observe(els.hero);
    } catch (e) { /* sem barra fixa */ }
  }

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* segue sem modo offline */ });
    });
  }
  try {
    if (isInstalled() && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  } catch (e) { /* sem armazenamento persistente */ }

  if (mode === 'cloud') startCloud();
  else startLocal();
})();
</script>
</body>
</html>
